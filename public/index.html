<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dr. Quest โรงพยาบาลป่วน</title>
<meta name="description" content="เกมไทคูนโรงพยาบาล 3D เดินเก็บยา จ่ายให้คนไข้ จ้างพยาบาล ขยายโรงพยาบาล เล่นฟรีบนเว็บและมือถือ">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4caf50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dr. Quest">
<meta property="og:type" content="website">
<meta property="og:title" content="Dr. Quest โรงพยาบาลป่วน">
<meta property="og:description" content="เกมไทคูนโรงพยาบาล 3D เดินเก็บยา จ่ายให้คนไข้ จ้างพยาบาล ขยายโรงพยาบาล เล่นฟรีบนเว็บและมือถือ">
<meta property="og:image" content="https://niasmin.github.io/Quest-Finance/og-image.png">
<meta property="og:url" content="https://niasmin.github.io/Quest-Finance/">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1d2433; --green: #3fbf5f; --gold: #ffd166; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fdcff; font-family: 'Mitr', sans-serif; color: #fff;
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }

  .pill { background: rgba(20, 28, 48, .55); border-radius: 999px; padding: 6px 14px; text-shadow: 0 2px 0 rgba(0,0,0,.35); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  #hud { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 10px; right: 10px; display: none; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
  #money { font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 6px; transition: transform .1s; }
  #money.bump { transform: scale(1.12); }
  #money .ico { font-size: 26px; }
  #left { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  #bag { font-size: 16px; }
  #bag.full { background: rgba(229, 72, 77, .85); }
  #right { display: flex; flex-direction: column; gap: 8px; }
  #menubtn, #soundbtn { pointer-events: auto; border: none; color: #fff; font: inherit; font-size: 18px; width: 40px; height: 40px; padding: 0; cursor: pointer; }
  #goal { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom)); font-size: 15px; display: none; white-space: nowrap; max-width: 94vw; overflow: hidden; text-overflow: ellipsis; }

  #joy { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255,255,255,.25); border: 3px solid rgba(255,255,255,.6); display: none; pointer-events: none; }
  #knob { position: absolute; left: 32px; top: 32px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 3px 8px rgba(0,0,0,.25); }
  #hint { position: fixed; bottom: calc(66px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); font-size: 15px; display: none; pointer-events: none; animation: float 1.6s ease-in-out infinite; }
  @keyframes float { 50% { transform: translate(-50%, -6px); } }

  .float { position: fixed; pointer-events: none; font-weight: 700; font-size: 20px; text-shadow: 0 2px 0 rgba(0,0,0,.45), 0 0 6px rgba(0,0,0,.25); transform: translate(-50%, -50%); white-space: nowrap; }

  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px;
    background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.25), rgba(0,0,0,0) 60%), linear-gradient(180deg, #63c7ff, #2f9e57); text-align: center; z-index: 10; }
  #start img { width: min(92vw, 520px); image-rendering: pixelated; filter: drop-shadow(0 6px 0 rgba(0,0,0,.2)); }
  #start h2 { margin: 0; font-size: clamp(22px, 6vw, 32px); text-shadow: 0 3px 0 rgba(0,0,0,.3); }
  #start p { margin: 0; max-width: 420px; font-size: 16px; line-height: 1.6; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .btn { border: none; border-radius: 18px; padding: 14px 34px; font: inherit; font-size: 22px; font-weight: 700; color: #3b2400; background: linear-gradient(180deg, #ffe08a, #f5a623); box-shadow: 0 6px 0 #b86b00; cursor: pointer; pointer-events: auto; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b86b00; }

  #menu { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 9; }
  #menu .box { background: #fff; color: var(--ink); border-radius: 20px; padding: 22px; width: min(320px, 88vw); text-align: center; }
  #menu h3 { margin: 0 0 14px; }
  #menu button { display: block; width: 100%; margin-top: 10px; }
  .btn.ghost { background: #e9eef7; color: var(--ink); box-shadow: 0 4px 0 #b9c3d6; font-size: 18px; }
  .btn.danger { background: #ffd9d9; color: #a3121b; box-shadow: 0 4px 0 #e0a0a0; font-size: 16px; }
  #saved { font-size: 13px; opacity: 0; transition: opacity .3s; }
  #saved.show { opacity: 1; }
  #saved.bad { background: rgba(229, 72, 77, .9); }
  #savenote { font-size: 13px; line-height: 1.5; color: #4b5a70; margin: 12px 0 0; }
  #savenote.bad { color: #a3121b; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
</style>
</head>
<body>
<div id="view"></div>
<div id="loading">กำลังโหลด…</div>

<div id="hud">
  <div id="left">
    <div id="money" class="pill"><span class="ico">💵</span><span id="moneyval">0</span></div>
    <div id="bag" class="pill">🎒 0/10</div>
    <div id="saved" class="pill"></div>
  </div>
  <div id="right">
    <button id="menubtn" class="pill" aria-label="เมนู">⚙️</button>
    <button id="soundbtn" class="pill" aria-label="เสียง">🔊</button>
  </div>
</div>
<div id="goal" class="pill"></div>
<div id="hint" class="pill">ลากนิ้วบนจอเพื่อเดิน</div>
<div id="joy"><div id="knob"></div></div>

<div id="start">
  <img src="logo.png" alt="Dr. Quest">
  <h2>🏥 โรงพยาบาลป่วน</h2>
  <p>เดินเก็บยาจากเครื่อง เอาไปวางที่เคาน์เตอร์ จ่ายยาให้คนไข้ เก็บเงิน แล้วขยายโรงพยาบาลให้ใหญ่ที่สุด!</p>
  <button id="startbtn" class="btn">เปิดโรงพยาบาล</button>
</div>

<div id="menu">
  <div class="box">
    <h3>⚙️ เมนู</h3>
    <button id="resume" class="btn ghost">เล่นต่อ</button>
    <button id="savenow" class="btn ghost">💾 บันทึกตอนนี้</button>
    <button id="copycode" class="btn ghost">📋 คัดลอกโค้ดเซฟ</button>
    <button id="loadcode" class="btn ghost">📥 ใส่โค้ดเซฟ</button>
    <p id="savenote"></p>
    <button id="reset" class="btn danger">เริ่มใหม่ทั้งหมด</button>
  </div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
