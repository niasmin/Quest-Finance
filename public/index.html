<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Quest Online</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --panel: rgba(16, 22, 34, 0.82); --text: #eef2f8; --accent: #f2c14e; --hp: #e5484d; --xp: #4fa3f7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1320; color: var(--text); font-family: 'Sarabun', sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

  #login { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #24345a, #0d1320 70%); z-index: 10; }
  #login form { background: var(--panel); padding: 32px; border-radius: 16px; width: min(360px, calc(100vw - 32px)); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  #login h1 { margin: 0 0 4px; color: var(--accent); font-size: 32px; letter-spacing: 1px; }
  #login p { margin: 0 0 20px; opacity: .75; }
  #login input, #login button { width: 100%; padding: 12px 14px; border-radius: 10px; border: none; font: inherit; font-size: 16px; }
  #login input { background: #1c2740; color: var(--text); margin-bottom: 12px; }
  #login button { background: var(--accent); color: #1a1a1a; font-weight: 700; cursor: pointer; }

  #hud { position: fixed; top: 12px; left: 12px; background: var(--panel); padding: 10px 14px; border-radius: 12px; width: 240px; display: none; }
  #hud .name { font-weight: 700; }
  .bar { height: 10px; background: #2a3550; border-radius: 6px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; transition: width .15s; }
  #hpbar { background: var(--hp); }
  #xpbar { background: var(--xp); }
  #hud small { opacity: .8; }

  #chat { position: fixed; left: 12px; bottom: 12px; width: min(380px, calc(100vw - 24px)); display: none; }
  #chatlog { background: var(--panel); border-radius: 12px 12px 0 0; padding: 8px 12px; height: 150px; overflow-y: auto; font-size: 14px; }
  #chatlog .sys { color: var(--accent); }
  #chatlog b { color: #9fd0ff; }
  #chatinput { width: 100%; padding: 8px 12px; border: none; border-radius: 0 0 12px 12px; background: #1c2740; color: var(--text); font: inherit; }

  #help { position: fixed; top: 12px; right: 12px; background: var(--panel); padding: 8px 12px; border-radius: 10px; font-size: 13px; opacity: .85; display: none; }

  #touch { display: none; }
  @media (pointer: coarse) {
    #help { display: none !important; }
    #chat { bottom: auto; top: 120px; width: 260px; }
    #chatlog { height: 90px; }
    #touch.on { display: block; }
    #joy { position: fixed; left: 24px; bottom: 24px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.2); }
    #joyknob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.35); }
    #atk { position: fixed; right: 28px; bottom: 36px; width: 90px; height: 90px; border-radius: 50%; border: none; background: rgba(229,72,77,.75); color: #fff; font: inherit; font-size: 18px; font-weight: 700; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="login">
  <form id="loginform">
    <h1>Quest Online</h1>
    <p>เกม MMORPG บนเว็บ เล่นพร้อมเพื่อนได้ทันที</p>
    <input id="nameinput" maxlength="16" placeholder="ชื่อตัวละคร" autocomplete="off" required>
    <button type="submit">เข้าสู่โลก</button>
  </form>
</div>

<div id="hud">
  <div class="name" id="hudname"></div>
  <div class="bar"><div id="hpbar"></div></div>
  <small id="hptext"></small>
  <div class="bar"><div id="xpbar"></div></div>
  <small id="xptext"></small>
</div>

<div id="help">WASD / ลูกศร = เดิน · Space = โจมตี · Enter = แชท<br>เขตเมือง (วงกลมกลางแผนที่) ปลอดภัยและฟื้น HP เร็ว</div>

<div id="chat">
  <div id="chatlog"></div>
  <input id="chatinput" maxlength="120" placeholder="กด Enter เพื่อพิมพ์…">
</div>

<div id="touch">
  <div id="joy"><div id="joyknob"></div></div>
  <button id="atk">โจมตี</button>
</div>

<script src="client.js"></script>
</body>
</html>
