<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dr. Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Mitr:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --panel: rgba(16, 30, 44, 0.85); --text: #eef6f8; --accent: #3ee0c5; --hp: #e5484d; --xp: #4fa3f7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1a24; color: var(--text); font-family: 'Sarabun', sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

  #login { position: fixed; inset: 0; overflow-y: auto; background: radial-gradient(circle at 50% 20%, #1f4a5c, #0c1a24 70%); z-index: 10; padding: 24px 16px; }
  #login form { max-width: 820px; margin: 0 auto; text-align: center; }
  #login h1 { margin: 0; font-family: 'Mitr', sans-serif; font-size: 44px; color: var(--accent); }
  #login h1 span { color: #ff6b6b; }
  #login .tag { margin: 4px 0 20px; opacity: .8; }
  #nameinput { width: min(360px, 100%); padding: 12px 14px; border-radius: 10px; border: none; font: inherit; font-size: 16px; background: #183242; color: var(--text); }
  #classes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin: 18px 0; text-align: left; }
  .cls { background: var(--panel); border: 2px solid transparent; border-radius: 12px; padding: 12px; cursor: pointer; transition: transform .1s, border-color .1s; }
  .cls:hover { transform: translateY(-2px); }
  .cls.sel { border-color: var(--accent); background: rgba(62, 224, 197, .12); }
  .cls .head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
  .cls .icon { font-size: 28px; }
  .cls .meta { font-size: 13px; opacity: .85; margin-top: 6px; line-height: 1.5; }
  .cls .meta b { color: var(--accent); font-weight: 600; }
  #startbtn { padding: 14px 40px; border-radius: 12px; border: none; background: var(--accent); color: #0c1a24; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; }

  #hud { position: fixed; top: 12px; left: 12px; background: var(--panel); padding: 10px 14px; border-radius: 12px; width: 250px; display: none; }
  #hud .name { font-weight: 700; }
  .bar { height: 10px; background: #2a3a50; border-radius: 6px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; transition: width .15s; }
  #hpbar { background: var(--hp); }
  #xpbar { background: var(--xp); }
  #hud small { opacity: .85; display: block; }
  #skillinfo { margin-top: 6px; font-size: 13px; color: var(--accent); }

  #chat { position: fixed; left: 12px; bottom: 12px; width: min(380px, calc(100vw - 24px)); display: none; }
  #chatlog { background: var(--panel); border-radius: 12px 12px 0 0; padding: 8px 12px; height: 150px; overflow-y: auto; font-size: 14px; }
  #chatlog .sys { color: #ffd166; }
  #chatlog b { color: #9fd0ff; }
  #chatinput { width: 100%; padding: 8px 12px; border: none; border-radius: 0 0 12px 12px; background: #183242; color: var(--text); font: inherit; }

  #help { position: fixed; top: 12px; right: 12px; background: var(--panel); padding: 8px 12px; border-radius: 10px; font-size: 13px; opacity: .9; display: none; }

  #touch { display: none; }
  @media (pointer: coarse) {
    #help { display: none !important; }
    #chat { bottom: auto; top: 150px; width: 260px; }
    #chatlog { height: 90px; }
    #touch.on { display: block; }
    #joy { position: fixed; left: 24px; bottom: 24px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.2); }
    #joyknob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.35); }
    #atk, #skl { position: fixed; border-radius: 50%; border: none; color: #fff; font: inherit; font-weight: 700; }
    #atk { right: 28px; bottom: 36px; width: 90px; height: 90px; background: rgba(229,72,77,.8); font-size: 18px; }
    #skl { right: 128px; bottom: 30px; width: 70px; height: 70px; background: rgba(62,224,197,.8); color: #0c1a24; font-size: 15px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="login">
  <form id="loginform">
    <h1>Dr. Quest <span>ล่าเชื้อป่วน</span></h1>
    <p class="tag">ทีมสหวิชาชีพบุกปราบเชื้อโรค ชวนเพื่อนมาเข้าเวรด้วยกัน!</p>
    <input id="nameinput" maxlength="16" placeholder="ชื่อตัวละคร" autocomplete="off" required>
    <div id="classes"></div>
    <button id="startbtn" type="submit">เข้าเวร!</button>
  </form>
</div>

<div id="hud">
  <div class="name" id="hudname"></div>
  <div class="bar"><div id="hpbar"></div></div>
  <small id="hptext"></small>
  <div class="bar"><div id="xpbar"></div></div>
  <small id="xptext"></small>
  <div id="skillinfo"></div>
</div>

<div id="help">WASD / ลูกศร = เดิน · Space = โจมตี · Q = สกิล · Enter = แชท<br>โรงพยาบาล (วงกลมกลางแผนที่) ปลอดภัยและฟื้น HP เร็ว<br>ยิ่งไกลโรงพยาบาลเชื้อยิ่งโหด · บอสอยู่มุมซ้ายบน ☠</div>

<div id="chat">
  <div id="chatlog"></div>
  <input id="chatinput" maxlength="120" placeholder="กด Enter เพื่อพิมพ์…">
</div>

<div id="touch">
  <div id="joy"><div id="joyknob"></div></div>
  <button id="skl">สกิล</button>
  <button id="atk">โจมตี</button>
</div>

<script src="shared.js"></script>
<script src="client.js"></script>
</body>
</html>
